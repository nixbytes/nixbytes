name: Update README Summary

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'summary_updater/**'
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolinski/rust-toolchain@1
        with:
          toolchain: stable
          cache: true

      - name: Build and Run Updater
        run: |
          cd summary_updater
          cargo build --release
          cd ..
          ./summary_updater/target/release/summary_updater

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README summary [skip ci]"
            git push
          fi

